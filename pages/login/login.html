<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="/../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="min-vh-100 d-flex align-items-center">
      <div
        class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start vh-100 w-100"
      >
        <div class="col-lg-6 d-none d-lg-block h-100 p-0">
          <img
            src="https://res.cloudinary.com/dzkkqkuav/image/upload/q_auto,f_auto/v1778531757/IMG_20241110_184047_HDR_2_bruvrc.jpg"
            class="w-100 h-100"
            alt=""
          />
        </div>

        <div
          class="col-12 col-lg-6 d-flex flex-column align-items-center justify-content-center h-100"
        >
          <div class="text-center">
            <h1 class="mb-4">Meu Rancho</h1>
            <h2>Bem-Vindo de volta!</h2>
            <p>Acesse seu caderno digital de propriedades.</p>
          </div>

          <form
            action="../propriedades/propriedades.html"
            method="get"
            class="col-12 d-flex flex-column align-items-center justify-content-center"
          >
            <div class="mb-3 col-8">
              <label class="form-label">E-mail</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>
                <input
                  class="form-control py-2"
                  placeholder="Seu e-mail"
                  required
                  type="email"
                />
              </div>
            </div>

            <div class="mb-3 col-8">
              <label class="form-label"
                >Senha <span class="text-danger">*</span></label
              >
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input
                  type="password"
                  class="form-control py-2"
                  placeholder="••••••••"
                  required
                  minlength="8"
                  maxlength="14"
                />
              </div>
            </div>

            <div class="mt-3 mb-3 col-8 d-flex justify-content-between">
              <label id="lembrar">
                <input type="checkbox" name="" id="" />
                Lembrar de mim
              </label>
              <a href="">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn btn-primary col-8 mb-3 py-2">
              ENTRAR
            </button>
          </form>

          <p>
            Novo por aqui?
            <a href="../cadastro/cadastro.html">Criar conta</a>
          </p>
        </div>
      </div>
    </main>

    <script
      defer
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
