<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="/../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="min-vh-100 d-flex align-items-center">
      <div
        class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start vh-100 w-100"
      >
        <div class="col-lg-6 d-none d-lg-block h-100 p-0">
          <img
            src="https://res.cloudinary.com/dzkkqkuav/image/upload/v1778531757/IMG_20250610_172549_n5hsod.jpg"
            class="w-100 h-100"
            alt=""
          />
        </div>

        <div
          class="col-12 col-lg-6 d-flex flex-column align-items-center justify-content-center h-100"
        >
          <div class="text-center">
            <h1>Meu Rancho</h1>
            <h2>Comece sua jornada rural</h2>
            <p>Crie sua conta para gerenciar suas propriedades.</p>
          </div>

          <div class="mb-3 col-8">
            <label class="form-label">Nome</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-person"></i>
              </span>
              <input
                type="text"
                class="form-control py-2"
                placeholder="Seu nome"
              />
            </div>
          </div>

          <div class="mb-3 col-8">
            <label class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="text"
                class="form-control py-2"
                placeholder="seu@email.com"
              />
            </div>
          </div>

          <div class="mb-3 col-8">
            <label class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-lock"></i>
              </span>
              <input
                type="text"
                class="form-control py-2"
                placeholder="Minimo 8 caracteres"
              />
            </div>
          </div>

          <button type="button" class="btn btn-primary py-2 col-8">
            CRIAR CONTA
          </button>

          <div class="mt-3">
            <p>Já tem uma conta? <a href="">Fazer Login</a></p>
          </div>
        </div>
      </div>
    </main>

    <script
      defer
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
