<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Propriedade</title>

    <link
      rel="stylesheet"
      href="/../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="nova-propriedade.css" />
  </head>
  <body>
    <main class="d-flex align-items-center justify-content-center min-vh-100">
      <div class="row g-0 col-10 align-items-stretch justify-content-center">
        <div
          class="d-none d-md-block col-md-5 col-lg-4 px-0 position-relative imagem"
        >
          <img
            src="https://res.cloudinary.com/dzkkqkuav/image/upload/w_447,h_608,q_auto,f_auto/v1779593162/unnamed_zrnehj.png"
            class="w-100 h-100 object-fit-cover rounded-start-4"
            alt=""
          />

          <div
            class="position-absolute top-0 start-0 w-100 h-100 rounded-start-4 filtro"
          ></div>

          <div class="position-absolute bottom-0 start-0 w-100 p-4">
            <h1>Expanda seus horizontes.</h1>
            <p class="w-75">
              Cadastre novas terras e integre sua gestão rural com precisão e
              facilidade.
            </p>
          </div>
        </div>

        <div
          class="d-flex flex-column col-md-5 col-lg-4 px-0 align-items-center justify-content-center div-textos rounded-end-4 mx-5 my-5 mx-md-0 my-md-0"
        >
          <div class="col-10">
            <div class="d-flex flex-column cabecalho mb-4">
              <h3><i class="fa-solid fa-tractor"></i> Meu Rancho</h3>
              <h1>Nova Propriedade</h1>
              <p>Preencha os dados básicos para começar.</p>
            </div>
          </div>

          <form
            action="../propriedades/propriedades.html"
            method="get"
            class="d-flex flex-column w-100 align-items-center mb-3"
          >
            <div class="mb-4 col-10">
              <label class="form-label">NOME DA PROPRIEDADE</label>
              <div class="input-group">
                <input
                  class="form-control py-3"
                  placeholder="Ex: Fazendo Xaxim Velho"
                  required
                  type="text"
                />
              </div>
            </div>

            <div class="mb-4 col-10">
              <div class="d-flex flex-column flex-md-row gx-3">
                <div class="col-12 col-md6">
                  <label class="form-label">CIDADE</label>
                  <div class="input-group">
                    <input
                      class="form-control py-3"
                      placeholder="Ex: Guarapuava"
                      required
                      type="text"
                    />
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">ESTADO</label>
                  <div class="input-group">
                    <input
                      class="form-control py-3 rounded-1"
                      placeholder="Ex: PR"
                      required
                      type="text"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div
              class="col-10 col-md-10 d-flex align-items-center justify-content-center"
            >
              <button
                type="submit"
                class="btn btn-primary w-100 py-3 rounded-3"
              >
                Salvar Propriedade <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </form>

          <div class="col-10 justify-content-center d-flex">
            <a
              href="../propriedades/propriedades.html"
              class="btn btn-outline-none w-100 border-0 botao-cancelar"
            >
              <i class="bi bi-arrow-left"></i> Voltar a Propriedades
            </a>
          </div>
        </div>
      </div>
    </main>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
