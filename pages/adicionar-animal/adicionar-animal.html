<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar Animal</title>

    <link rel="icon" type="image/webp" href="../../assets/img/logo2.webp" />

    <!-- <link
      rel="stylesheet"
      href="../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    /> -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    /> -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../adicionar-animal/adicionar-animal.css" />
  </head>
  <body class="vh-100">
    <header class="sticky-top">
      <div class="d-flex col-12 justify-content-center">
        <img src="../../assets/img/logo2.webp" alt="" class="logo" />
      </div>
    </header>
    <main class="container">
      <section
        class="d-flex flex-column justify-content-center align-items-center mt-5"
      >
        <div class="div-tamanho mx-2 mb-5">
          <div class="position-relative imagem">
            <img
              class="rounded-top-4 boi"
              src="https://res.cloudinary.com/dzkkqkuav/image/upload/w_1100,h_300,q_auto,f_auto/v1778531756/IMG_20260208_185633_tgokif.jpg"
              alt=""
            />

            <div class="position-absolute bottom-0 start-0 w-100 ms-4 titulo">
              <h1 class="mb-0">Novo Animal</h1>
              <p class="mt-0">
                Complete as informações para o registro do animal.
              </p>
            </div>
          </div>

          <form
            action="../animais/animais.html"
            class="d-flex flex-column pt-4 m-0 px-4 rounded-bottom-4"
          >
            <div class="row g-2 pb-4">
              <div class="col-12 col-md-6">
                <div class="mb-3">
                  <label for="" class="form-label"
                    >Número de Identificação (Brinco)</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="numeroBrinco"
                    placeholder="Ex: #04"
                    required
                  />
                </div>
              </div>

              <div class="col-12 col-md-6">
                <label for="" class="form-label">Raça</label>

                <select
                  class="form-select"
                  aria-label="Raça do Animal"
                  id="selectRaca"
                  required
                >
                  <option selected value="">Raça do Animal</option>

                  <!-- Corte -->
                  <optgroup label="Corte">
                    <option value="nelore">Nelore</option>
                    <option value="angus">Angus</option>
                    <option value="brahman">Brahman</option>
                    <option value="senepol">Senepol</option>
                    <option value="hereford">Hereford</option>
                    <option value="brangus">Brangus</option>
                    <option value="simmental">Simmental</option>
                    <option value="charolês">Charolês</option>
                    <option value="limousin">Limousin</option>
                  </optgroup>

                  <!-- Leite -->
                  <optgroup label="Leite">
                    <option value="gir-leiteiro">Gir Leiteiro</option>
                    <option value="girolando">Girolando</option>
                    <option value="holandês">Holandês</option>
                    <option value="jersey">Jersey</option>
                    <option value="pardo-suíço">Pardo Suíço</option>
                  </optgroup>

                  <!-- Cruzamento -->
                  <optgroup label="Cruzamento">
                    <option value="canchim">Canchim</option>
                    <option value="tabapuã">Tabapuã</option>
                    <option value="indubrasil">Indubrasil</option>
                    <option value="sindi">Sindi</option>
                  </optgroup>
                </select>
              </div>
            </div>

            <div class="mb-4 genero">
              <p>Gênero do Animal</p>
              <div class="d-flex gap-4 mb-4">
                <input
                  type="radio"
                  class="btn-check"
                  name="genero"
                  id="macho"
                  value="macho"
                  autocomplete="off"
                  required
                />
                <label class="btn w-50 py-3 fs-5 fw-bold macho" for="macho">
                  <i class="bi bi-gender-male"></i> Macho
                </label>

                <input
                  type="radio"
                  class="btn-check"
                  name="genero"
                  id="femea"
                  value="femea"
                  autocomplete="off"
                />
                <label class="btn w-50 py-3 fs-5 fw-bold femea" for="femea">
                  <i class="bi bi-gender-female"></i> Fêmea
                </label>
              </div>
            </div>

            <div class="col-12 mb-4 pb-4 idade">
              <p>Idade do Animal</p>
              <div class="row g-2">
                <div class="col-6 col-md-3 mb-2">
                  <input
                    type="radio"
                    class="btn-check"
                    name="idade"
                    id="idade1"
                    value="0-12"
                    autocomplete="off"
                    required
                  />
                  <label class="btn btn-outline-secondary w-100" for="idade1"
                    >0-12 meses</label
                  >
                </div>
                <div class="col-6 col-md-3">
                  <input
                    type="radio"
                    class="btn-check"
                    name="idade"
                    id="idade2"
                    value="12-24"
                    autocomplete="off"
                  />
                  <label class="btn btn-outline-secondary w-100" for="idade2"
                    >12-24 meses</label
                  >
                </div>
                <div class="col-6 col-md-3">
                  <input
                    type="radio"
                    class="btn-check"
                    name="idade"
                    id="idade3"
                    value="24-36"
                    autocomplete="off"
                  />
                  <label class="btn btn-outline-secondary w-100" for="idade3"
                    >24-36 meses</label
                  >
                </div>
                <div class="col-6 col-md-3">
                  <input
                    type="radio"
                    class="btn-check"
                    name="idade"
                    id="idade4"
                    value="+36"
                    autocomplete="off"
                  />
                  <label class="btn btn-outline-secondary w-100" for="idade4"
                    >+36 meses</label
                  >
                </div>
              </div>
            </div>

            <div class="row flex-column flex-md-row pb-4 gy-2">
              <a href="../animais/animais.html" class="col-12 col-md-6 voltar">
                <div>
                  <button type="button" class="btn btn-outline-none w-100">
                    <i class="bi bi-arrow-left seta1"></i> Voltar
                  </button>
                </div>
              </a>

              <div class="col-12 col-md-6 mb-3">
                <button class="btn btn-primary w-100 adicionar" type="submit">
                  Adicionar Animal <i class="bi bi-arrow-right seta2"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
    <!-- <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script> -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
