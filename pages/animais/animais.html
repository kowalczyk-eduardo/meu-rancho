<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animais</title>

    <link
      rel="stylesheet"
      href="/../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="animais.css" />
  </head>
  <body>
    <header class="d-flex mb-5">
      <div class="col-12 d-flex justify-content-center">
        <img src="../../assets/img/logo2.png" alt="" class="logo" />
      </div>
    </header>

    <main class="container">
      <section class="px-3 px-md-0">
        <div class="">
          <a
            href="../propriedades/propriedades.html"
            class="btn btn-outline-none ps-0 voltar"
          >
            <i class="bi bi-arrow-left seta1"></i> Voltar a Propriedades
          </a>
        </div>

        <div
          class="d-flex flex-column flex-md-row align-items-stretch align-items-md-start justify-content-between mb-2"
        >
          <div class="mb-2">
            <h1 class="mb-0">Animais: Fazenda Xaxim Velho</h1>
          </div>

          <div class="flex-shrink-0">
            <a href="../adicionar-animal/adicionar-animal.html ">
              <button class="btn btn-primary px-4 w-md-auto">
                <i class="bi bi-plus-lg"></i> Adicionar Animal
              </button>
            </a>
          </div>
        </div>

        <div class="filtro mb-3 d-none d-md-block col-12">
          <button
            class="btn btn-primary mb-1 w-100 mx-auto py-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseExample"
            aria-expanded="false"
            aria-controls="collapseExample"
          >
            Filtro de Animais
          </button>
          <div class="collapse" id="collapseExample">
            <div class="card card-body">
              <div class="row col-12 ps-3">
                <div class="col-3">
                  <select
                    class="form-select rounded-5"
                    aria-label="Default select example"
                  >
                    <option selected>Gênero do Animal</option>
                    <option value="1">Macho</option>
                    <option value="2">Fêmea</option>
                  </select>
                </div>

                <div class="col-6">
                  <div class="input-group flex-nowrap rounded-5">
                    <span class="input-group-text rounded-5" id="addon-wrapping"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="search"
                      class="form-control rounded-5"
                      placeholder="Buscar Animal (Brinco)"
                      aria-label="Username"
                      aria-describedby="addon-wrapping"
                    />
                  </div>
                </div>

                <div class="col-3">
                  <select
                    class="form-select rounded-5"
                    aria-label="Default select example"
                  >
                    <option selected>Idade do Animal</option>
                    <option value="1">0-12 Meses</option>
                    <option value="2">13-24 Meses</option>
                    <option value="3">25-36 Meses</option>
                    <option value="4">+36 Meses</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="d-md-none mb-2">
          <button
            class="btn btn-primary botao-off"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#staticBackdrop"
            aria-controls="staticBackdrop"
          >
            <i class="bi bi-sliders"></i> Filtro
          </button>

          <div
            class="offcanvas offcanvas-start"
            data-bs-backdrop="static"
            tabindex="-1"
            id="staticBackdrop"
            aria-labelledby="staticBackdropLabel"
          >
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="staticBackdropLabel">
                Filtros de Busca
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              ></button>
            </div>
            <div class="offcanvas-body d-flex flex-column">
              <div class="d-flex flex-column">
                <div class="col-12 mb-3">
                  <div class="input-group flex-nowrap rounded-5">
                    <span class="input-group-text rounded-5" id="addon-wrapping"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="search"
                      class="form-control rounded-5"
                      placeholder="Buscar Animal (Brinco)"
                      aria-label="Username"
                      aria-describedby="addon-wrapping"
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <p class="mb-0">Gênero</p>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      Macho
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      Fêmea
                    </label>
                  </div>
                </div>

                <div>
                  <div class="dropdown">
                    <button
                      class="btn btn-primary dropdown-toggle botao-drop"
                      type="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                    >
                      Idade do Animal
                    </button>
                    <ul class="dropdown-menu">
                      <li>
                        <a
                          class="dropdown-item py-1 px-4 border-bottom text-center"
                          href="#"
                          >0-12 Meses</a
                        >
                      </li>
                      <li>
                        <a
                          class="dropdown-item py-1 border-bottom text-center"
                          href="#"
                          >13-24 Meses</a
                        >
                      </li>
                      <li>
                        <a
                          class="dropdown-item py-1 border-bottom text-center"
                          href="#"
                          >25-36 Meses</a
                        >
                      </li>
                      <li>
                        <a class="dropdown-item py-1 text-center" href="#"
                          >+36 Meses</a
                        >
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
              <div class="mt-auto d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-outline-secondary w-50"
                  id="btnReset"
                >
                  Resetar Filtros
                </button>

                <button
                  type="button"
                  class="btn btn-primary w-50"
                  id="btnSalvar"
                >
                  Salvar Filtros
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="row gy-4 cards">
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card rounded-4 border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between px-2 mb-4">
                  <span class="badge">#137</span>
                  <i class="bi bi-gender-male rounded-5 px-2"></i>
                </div>

                <div class="px-2">
                  <h5>Nelore</h5>
                  <p>+36 meses</p>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <div class="card rounded-4 border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between px-2 mb-4">
                  <span class="badge">#58</span>
                  <i class="bi bi-gender-female rounded-5 px-2"></i>
                </div>

                <div class="px-2">
                  <h5>Angus</h5>
                  <p>13-24 meses</p>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <div class="card rounded-4 border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between px-2 mb-4">
                  <span class="badge">#04</span>
                  <i class="bi bi-gender-male rounded-5 px-2"></i>
                </div>

                <div class="px-2">
                  <h5>Cruzamento</h5>
                  <p>0-12 meses</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
