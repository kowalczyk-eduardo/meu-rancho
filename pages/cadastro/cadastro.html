<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link
      rel="stylesheet"
      href="/../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="cadastro.css" />
  </head>
  <body>
    <main class="min-vh-100 d-flex align-items-center">
      <div class="d-flex flex-row align-items-center vh-100 w-100">
        <div class="col-lg-6 d-none d-lg-block h-100">
          <img
            src="https://images.unsplash.com/photo-1691704951233-1954a27c8ce2?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            class="w-100 h-100"
            alt=""
          />
        </div>

        <div class="col-lg-6 d-flex flex-column align-items-center">
          <h1>Meu Rancho</h1>
          <h2>Comece sua jornada rural</h2>
          <p>Crie sua conta para gerenciar suas propriedades.</p>

          <div class="mb-3">
            <label class="form-label">Nome</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control" placeholder="Seu nome" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="text"
                class="form-control"
                placeholder="seu@email.com"
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text">
                <i class="bi bi-unlock2"></i>
              </span>
              <input
                type="text"
                class="form-control"
                placeholder="Minimo 8 caracteres"
              />
            </div>
          </div>

          <button type="button" class="btn btn-primary">CRIAR CONTA</button>

          <p class="">Já tem uma conta? <a href="">Fazer Login</a></p>
        </div>
      </div>
    </main>

    <script
      defer
      src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
