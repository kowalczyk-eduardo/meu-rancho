<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animais</title>

    <link
      rel="icon"
      type="image/webp"
      href="../assets/resources/images/logo2.webp"
    />

    <!-- <link
      rel="stylesheet"
      href="/../node_modules/bootstrap/dist/css/bootstrap.min.css"
    /> -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    /> -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="animais.css" />
  </head>
  <body>
    <header class="d-flex mb-5">
      <div class="col-12 d-flex justify-content-center">
        <img src="../assets/resources/images/logo2.webp" alt="" class="logo" />
      </div>
    </header>

    <main class="container pb-5">
      <section class="px-3 px-md-0">
        <div>
          <a
            href="../propriedades/index.html"
            class="btn btn-outline-none ps-0 border-0 voltar"
          >
            <i class="bi bi-arrow-left seta1"></i> Voltar a Propriedades
          </a>
        </div>

        <div
          class="d-flex flex-column flex-md-row align-items-stretch align-items-md-start justify-content-between mb-2"
        >
          <div class="mb-2">
            <h1 class="mb-0">Animais: Fazenda Xaxim Velho</h1>
          </div>

          <div class="flex-shrink-0">
            <a href="../adicionar-animal/index.html ">
              <button class="btn btn-primary px-4 w-md-auto">
                <i class="bi bi-plus-lg"></i> Adicionar Animal
              </button>
            </a>
          </div>
        </div>

        <div class="filtro mb-3 d-none d-md-block col-12">
          <button
            class="btn btn-primary mb-1 w-100 mx-auto py-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#collapseExample"
            aria-expanded="false"
            aria-controls="collapseExample"
          >
            Filtro de Animais
          </button>
          <div class="collapse" id="collapseExample">
            <div class="card card-body">
              <div class="row col-12 ps-3">
                <div class="col-3">
                  <select
                    class="form-select rounded-5"
                    aria-label="Default select example"
                    id="selectGenero"
                  >
                    <option selected>Gênero do Animal</option>
                    <option value="1">Macho</option>
                    <option value="2">Fêmea</option>
                  </select>
                </div>

                <div class="col-6">
                  <div class="input-group flex-nowrap rounded-5">
                    <span class="input-group-text rounded-5" id="addon-wrapping"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="search"
                      class="form-control rounded-5"
                      placeholder="Buscar Animal (Brinco)"
                      aria-label="Username"
                      aria-describedby="addon-wrapping"
                      id="pesquisarBrinco"
                    />
                  </div>
                </div>

                <div class="col-3 mb-2">
                  <select
                    class="form-select rounded-5"
                    aria-label="Default select example"
                    id="selectIdade"
                  >
                    <option selected>Idade do Animal</option>
                    <option value="1">0-12 Meses</option>
                    <option value="2">13-24 Meses</option>
                    <option value="3">25-36 Meses</option>
                    <option value="4">+36 Meses</option>
                  </select>
                </div>

                <div class="col-6 me-4">
                  <select
                    class="form-select rounded-5"
                    aria-label="Raça do Animal"
                    id="selectRaca"
                  >
                    <option selected value="">Raça do Animal</option>

                    <!-- Corte -->
                    <optgroup label="Corte">
                      <option value="nelore">Nelore</option>
                      <option value="angus">Angus</option>
                      <option value="brahman">Brahman</option>
                      <option value="senepol">Senepol</option>
                      <option value="hereford">Hereford</option>
                      <option value="brangus">Brangus</option>
                      <option value="simmental">Simmental</option>
                      <option value="charolês">Charolês</option>
                      <option value="limousin">Limousin</option>
                    </optgroup>

                    <!-- Leite -->
                    <optgroup label="Leite">
                      <option value="gir-leiteiro">Gir Leiteiro</option>
                      <option value="girolando">Girolando</option>
                      <option value="holandês">Holandês</option>
                      <option value="jersey">Jersey</option>
                      <option value="pardo-suíço">Pardo Suíço</option>
                    </optgroup>

                    <!-- Cruzamento -->
                    <optgroup label="Cruzamento">
                      <option value="canchim">Canchim</option>
                      <option value="tabapuã">Tabapuã</option>
                      <option value="indubrasil">Indubrasil</option>
                      <option value="sindi">Sindi</option>
                    </optgroup>
                  </select>
                </div>

                <div class="row col-6">
                  <div class="col-6">
                    <button
                      type="button"
                      class="btn btn-outline-secondary w-100 text-nowrap"
                      id="btnReset"
                    >
                      Resetar Filtros
                    </button>
                  </div>

                  <div class="col-6">
                    <button
                      type="button"
                      class="btn btn-primary w-100 text-nowrap"
                      id="btnSalvar"
                    >
                      Salvar Filtros
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="d-md-none mb-2">
          <button
            class="btn btn-primary botao-off"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#staticBackdrop"
            aria-controls="staticBackdrop"
          >
            <i class="bi bi-sliders"></i> Filtro
          </button>

          <div
            class="offcanvas offcanvas-start"
            data-bs-backdrop="static"
            tabindex="-1"
            id="staticBackdrop"
            aria-labelledby="staticBackdropLabel"
          >
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="staticBackdropLabel">
                Filtros de Busca
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              ></button>
            </div>
            <div class="offcanvas-body d-flex flex-column">
              <div class="d-flex flex-column">
                <div class="col-12 mb-3">
                  <div class="input-group flex-nowrap rounded-5">
                    <span class="input-group-text rounded-5" id="addon-wrapping"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="search"
                      class="form-control rounded-5"
                      placeholder="Buscar Animal (Brinco)"
                      aria-label="Username"
                      aria-describedby="addon-wrapping"
                    />
                  </div>
                </div>

                <div class="col-6 mb-3">
                  <select
                    class="form-select rounded-5"
                    aria-label="Raça do Animal"
                    id="selectRaca"
                  >
                    <option selected value="">Raça do Animal</option>

                    <!-- Corte -->
                    <optgroup label="Corte">
                      <option value="nelore">Nelore</option>
                      <option value="angus">Angus</option>
                      <option value="brahman">Brahman</option>
                      <option value="senepol">Senepol</option>
                      <option value="hereford">Hereford</option>
                      <option value="brangus">Brangus</option>
                      <option value="simmental">Simmental</option>
                      <option value="charolês">Charolês</option>
                      <option value="limousin">Limousin</option>
                    </optgroup>

                    <!-- Leite -->
                    <optgroup label="Leite">
                      <option value="gir-leiteiro">Gir Leiteiro</option>
                      <option value="girolando">Girolando</option>
                      <option value="holandês">Holandês</option>
                      <option value="jersey">Jersey</option>
                      <option value="pardo-suíço">Pardo Suíço</option>
                    </optgroup>

                    <!-- Cruzamento -->
                    <optgroup label="Cruzamento">
                      <option value="canchim">Canchim</option>
                      <option value="tabapuã">Tabapuã</option>
                      <option value="indubrasil">Indubrasil</option>
                      <option value="sindi">Sindi</option>
                    </optgroup>
                  </select>
                </div>

                <div class="mb-3 ms-1">
                  <p class="mb-0">Gênero</p>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      Macho
                    </label>
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      Fêmea
                    </label>
                  </div>
                </div>

                <div class="col-4 mb-3 ms-1">
                  <p class="mb-0">Idade do Animal</p>

                  <div
                    class="form-check border-bottom border-secondary pb-1 mb-1 rounded"
                  >
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      0-12 Meses
                    </label>
                  </div>

                  <div
                    class="form-check border-bottom border-secondary pb-1 mb-1 rounded"
                  >
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      13-24 Meses
                    </label>
                  </div>

                  <div
                    class="form-check border-bottom border-secondary pb-1 mb-1 rounded"
                  >
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      25-36 Meses
                    </label>
                  </div>

                  <div
                    class="form-check border-bottom border-secondary pb-1 mb-1 rounded"
                  >
                    <input
                      class="form-check-input"
                      type="radio"
                      name="radioDefault"
                      id="radioDefault1"
                    />
                    <label class="form-check-label" for="radioDefault1">
                      +36 Meses
                    </label>
                  </div>
                </div>
              </div>
              <div class="mt-auto d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-outline-secondary w-50"
                  id="btnReset"
                >
                  Resetar Filtros
                </button>

                <button
                  type="button"
                  class="btn btn-primary w-50"
                  id="btnSalvar"
                >
                  Salvar Filtros
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="row gy-4 cards">
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card rounded-4 border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between px-2 mb-4">
                  <span class="badge">#137</span>
                  <i class="bi bi-gender-male rounded-5 px-2"></i>
                </div>

                <div class="px-2">
                  <h5>Nelore</h5>
                  <p>+36 meses</p>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <div class="card rounded-4 border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between px-2 mb-4">
                  <span class="badge">#58</span>
                  <i class="bi bi-gender-female rounded-5 px-2"></i>
                </div>

                <div class="px-2">
                  <h5>Angus</h5>
                  <p>13-24 meses</p>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <div class="card rounded-4 border-0">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between px-2 mb-4">
                  <span class="badge">#04</span>
                  <i class="bi bi-gender-male rounded-5 px-2"></i>
                </div>

                <div class="px-2">
                  <h5>Cruzamento</h5>
                  <p>0-12 meses</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script> -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
